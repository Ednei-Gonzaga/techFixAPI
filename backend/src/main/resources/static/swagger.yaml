    parameters: 
      - name: id
        in: path  
        schema:
          type: number
        required: true
        description: ID Solicitação de Serviço
    get:
      tags: 
        - Service Orders
      summary: Busca detalhes da Ordem Serviço pelo ID
      description: Endpoint realiza consulta de Ordem Serviço pelo ID.Traz informações do Cliente e da Solicitação de Serviço com datas e status para melhor acompanhamento. Este endpoint é acessível somente a usuários do tipo MANAGER, TECHNICAL e ATTENDANT.
      responses:
