openapi: 3.0.3
info:
  title: TechFixApi REST
  version: 2.0.0
  description: |
    A TechFixApi é uma aplicação desenvolvida em Java e Spring Boot para gerenciar operações de assistência técnica. O sistema processa o controle de estoque de peças e o catálogo de serviços. A API gerencia o acesso de usuários através de tokens JWT e perfis de permissão. As respostas de erro seguem um padrão técnico, e os dados são entregues com paginação. Este é um projeto pessoal criado para aplicar e testar meus conhecimentos em desenvolvimento backend
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT

servers:
  - url: "http://localhost:8080"
    description: "Servidor Teste"

security:
  - bearerAuth: []

paths:
  /api/v2/auth/login:
    post:
      tags:
        - Authentication
      summary: Realizar a autenticação do usuário
      description: |
        Endpoint responsável por autenticar um usuário no sistema. Valida se é o primeiro acesso do usuário (obrigatoriedade de alterar a senha). 
        Se for o primeiro acesso, retorna um token temporário (válido por 10 minutos) para a alteração de senha, e com esse token só é possivel acessar as rotas de atualização senha.
        
        Este é um endpoint público e não requer autenticação.
      security: [] 
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationRequest'
      responses:
        '200':
          description: Autenticação bem-sucedida. Retorna o Token JWT de acesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Token:
                    type: string
                    description: Token JWT que concede acesso aos endpoints protegidos da API.
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '400':
          description: Corpo da requisição mal formatado, ausente ou contendo campos com valores inválidos (falhas de validação).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Credenciais de login ou senha inválidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Primeiro acesso detectado. O usuário deve alterar sua senha obrigatoriamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Alteração de senha obrigatória no primeiro acesso."
                  tempToken:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.tempTokenForPasswordChange..."

  /api/v2/users:
    post:
      tags:
        - Users
      summary: Criar um novo usuário / funcionário
      description: Registra um novo usuário. Gera uma senha temporária padronizada e envia um e-mail com as credencias de login. O username por padrão e o CPF cadastrado. Este endpoint é acessível somente a usuários do tipo MANAGER.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateDTO'
      responses:
        '201':
          description: Usuário cadastrado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResumeDTO'
        '400':
          description: "Corpo da requisição mal formatado, ausente ou contendo campos com valores inválidos (falhas de validação, ex: e-mail inválido, dados em branco)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Usuário sem  permissão para acessar rota.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Conflito de dados. Cadastro com CPF ou Email já existente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v2/users/password-reset/request-verification-codes:
    post:
      tags:
        - Users
      summary: Solicitar código de verificação para reset de senha
      description: Endpoint público para gerar um código de verificação seguro enviado via e-mail, para alteração de senha. Este é um endpoint público e não requer autenticação.
      security: [] 
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserEmailResetPassword'
      responses:
        '201':
          description: Código gerado e e-mail enviado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationCodesResumeDTO'
        '400':
          description: "Corpo da requisição mal formatado, ausente ou contendo campos com valores inválidos (ex: e-mail em branco ou fora do formato padrão)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Usuário não encontrado com o e-mail informado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v2/users/reset-password:
    put:
      tags:
        - Users
      summary: Alterar senha usando código de verificação (Não Logado)
      description: Altera a senha do usuário exigindo validação por um código de verificação. Este é um endpoint público e não requer autenticação.
      security: [] 
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestResetPasswordNotLogged'
      responses:
        '200':
          description: Senha alterada com sucesso.
          content: 
            application/json: 
              example: ok
        '400':
          description: "Corpo da requisição mal formatado, ausente ou erro de validação nos requisitos de campos (ex: força da nova senha ou e-mail inválido)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Código de verificação incorreto ou expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Nenhum usuário encontrado com o e-mail informado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v2/users/me/password:
    put:
      tags:
        - Users
      summary: Alterar própria senha (Usuário Logado)
      description: Permite que o usuário autenticado altere sua própria senha de acesso com a confirmação de sua senha atual. Este endpoint é acessível somente a usuários do tipo MANAGER, TECHNICAL e ATTENDANT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestResetPasswordUserLogged'
      responses:
        '200':
          description: Senha atualizada com sucesso.
          content:
            application/json:
              example: ok
        '400':
          description: "Corpo da requisição mal formatado, ausente ou requisitos de campos inválidos (ex: nova senha fora do padrão exigido)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: A senha atual fornecida está incorreta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v2/users/{id}:
    delete:
      tags:
        - Users
      summary: Desativar um usuário do sistema
      description: Desativa a conta de um usuário de forma lógica. Este endpoint é acessível somente a usuários do tipo MANAGER.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Usuário desativado com sucesso.
          content:
            application/json:
              example: no content
        '403':
          description: Acesso negado por falta de privilégios de perfil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Usuário não encontrado no sistema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v2/employees:
    get:
      tags:
        - Employees
      summary: Listar todos os funcionários
      description: Retorna uma listagem paginada de todos os funcionários cadastrados, filtrável por status e nome. Este endpoint é acessível somente a usuários do tipo MANAGER.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: boolean
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Listagem de funcionários recuperada com sucesso.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: '#/components/schemas/EmployeeFullDTO'
                  - $ref: '#/components/schemas/PageMetadata'
        '403':
          description: Acesso negado por falta de privilégios de perfil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v2/employees/{id}:
    get:
      tags:
        - Employees
      summary: Buscar funcionário por ID
      description: Este endpoint é acessível somente a usuários do tipo MANAGER.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Funcionário localizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeFullDTO'
        '403':
          description: Acesso negado por falta de permissões.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Funcionário não localizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    put:
      tags:
        - Employees
      summary: Atualizar cadastro de funcionário (perfil MANGER)
      description: Atualiza as informações de cadastro de um funcionário por seu ID. Modifica o login se o CPF for alterado. Este endpoint é acessível somente a usuários do tipo MANAGER.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeManagerUpdateDTO'
      responses:
        '200':
          description: Cadastro atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResumeDTO'
        '400':
          description: Corpo da requisição mal formatado, ausente ou contendo campos com valores inválidos (falhas de validação).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Acesso negado. Ação exclusiva para perfil Gestor/Admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Funcionário não localizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: O E-mail ou CPF novos já estão em uso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v2/employees/me:
    get:
      tags:
        - Employees
      summary: Buscar dados do funcionário logado
      description: Este endpoint é acessível somente a usuários do tipo MANAGER, TECHNICAL e ATTENDANT.
      responses:
        '200':
          description: Dados do funcionário logado retornados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResumeDTO'
        '403':
          description: Acesso negado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Perfil não localizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    put:
      tags:
        - Employees
      summary: Atualizar próprios dados cadastrais (Perfil do Usuário)
      description: Este endpoint é acessível somente a usuários do tipo MANAGER, TECHNICAL e ATTENDANT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeProfileUpdateDTO'
      responses:
        '200':
          description: Perfil pessoal atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResumeDTO'
        '400':
          description: "Corpo da requisição mal formatado, ausente ou contendo campos com valores inválidos (falhas de validação, ex: e-mail em formato incorreto)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Acesso negado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: O novo e-mail informado já pertence a outro usuário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v2/employees/search/cpf:
    post:
      tags:
        - Employees
      summary: Buscar funcionário por CPF
      description: Este endpoint é acessível somente a usuários do tipo MANAGER e ATTENDANT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeRequestCpf'
      responses:
        '200':
          description: Busca por CPF realizada com sucesso.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: '#/components/schemas/EmployeeResumeDTO'
                  - $ref: '#/components/schemas/PageMetadata'
        '400':
          description: Corpo da requisição mal formatado, ausente ou CPF com campos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Acesso negado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v2/parts:
    post:
      tags:
        - Parts
      summary: Cadastrar nova peça no estoque
      description: Este endpoint é acessível somente a usuários do tipo MANAGER.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartCreateDTO'
      responses:
        '201':
          description: Peça cadastrada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartFullDTO'
        '400':
          description: "Corpo da requisição mal formatado, ausente ou contendo campos com valores inválidos (ex: dados obrigatórios em branco ou com tipo de dado incorreto)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Acesso negado. Ação restrita por nível de usuário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    get:
      tags:
        - Parts
      summary: Listar todas as peças (Paginado)
      description: Este endpoint é acessível somente a usuários do tipo MANAGER, TECHNICAL e ATTENDANT.
      parameters:
        - name: nameOrCode
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Listagem de peças recuperada com sucesso.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: '#/components/schemas/PartFullDTO'
                  - $ref: '#/components/schemas/PageMetadata'
        '403':
          description: Acesso negado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v2/parts/{id}:
    get:
      tags:
        - Parts
      summary: Buscar peça por ID
      description: Este endpoint é acessível somente a usuários do tipo MANAGER, TECHNICAL e ATTENDANT.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Peça localizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartFullDTO'
        '403':
          description: Acesso negado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Peça não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    put:
      tags:
        - Parts
      summary: Atualizar cadastro completo da peça
      description: Este endpoint é acessível somente a usuários do tipo MANAGER.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartUpdateDTO'
      responses:
        '200':
          description: Dados atualizados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartFullDTO'
        '400':
          description: Corpo da requisição mal formatado, ausente ou contendo campos com valores inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Acesso negado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Peça não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    delete:
      tags:
        - Parts
      summary: Desativar peça (Inativar logicamente)
      description: Este endpoint é acessível somente a usuários do tipo MANAGER.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Peça inativada com sucesso.
          content:
            application/json:
              example: no content
        '403':
          description: Acesso negado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Peça não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v2/parts/{id}/quantity:
    patch:
      tags:
        - Parts
      summary: Registrar saída/baixa de quantidade no estoque
      description: Este endpoint é acessível somente a usuários do tipo MANAGER, TECHNICAL e ATTENDANT.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestRecordQuantityStock'
      responses:
        '200':
          description: Estoque abatido com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartFullDTO'
        '400':
          description: Corpo da requisição mal formatado, ausente ou contendo campos numéricos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Acesso negado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Peça não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: A quantidade solicitada excede o estoque disponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v2/parts/{id}/enable:
    patch:
      tags:
        - Parts
      summary: Reativar peça no sistema
      description: Este endpoint é acessível somente a usuários do tipo MANAGER.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Peça reativada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartFullDTO'
        '403':
          description: Acesso negado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Peça não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v2/service-catalogs:
    post:
      tags:
        - Service Catalogs
      summary: Cadastrar novo serviço no catálogo
      description: Este endpoint é acessível somente a usuários do tipo MANAGER.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCatalogCreatedDTO'
      responses:
        '201':
          description: Serviço cadastrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCatalogFullDTO'
        '400':
          description: "Corpo mal formatado, dados obrigatórios ausentes ou valores inválidos (ex: o preço de custo não pode ser menor que zero)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Acesso negado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    get:
      tags:
        - Service Catalogs
      summary: Listar serviços ativos do catálogo
      description: Este endpoint é acessível somente a usuários do tipo MANAGER, TECHNICAL e ATTENDANT.
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Listagem recuperada com sucesso.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: '#/components/schemas/ServiceCatalogFullDTO'
                  - $ref: '#/components/schemas/PageMetadata'
        '403':
          description: Acesso negado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v2/service-catalogs/{id}:
    put:
      tags:
        - Service Catalogs
      summary: Atualizar serviço no catálogo
      description: Este endpoint é acessível somente a usuários do tipo MANAGER.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCatalogUpdateDTO'
      responses:
        '200':
          description: Serviço atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCatalogFullDTO'
        '400':
          description: "Corpo mal formatado ou valores inválidos (ex: o preço de custo não pode ser negativo)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Acesso negado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
