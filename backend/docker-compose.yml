services:

#Postgres
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      ## Defina um USUÁRIO PARA O BANCO AQUI
      POSTGRES_USER: admin
      ## DEFINA UMA SENHA PARA O BANCO AQUI
      POSTGRES_PASSWORD: postgres123
      ## DEFINA UM NOME PARA O BANCO DE DADOS AQUI
      POSTGRES_DB: techfix_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TechFix
  api-java:
    build: . 
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Endereço URL do nosso banco de dados, o ultimo parametro do path eo nome do banco e tem que ser o mesmo do Service POSTGRES
      URL_DB: jdbc:postgresql://postgres:5432/techfix_db
      # Nome do banco de dados usado no service POSTGRES
      USERNAME_DB: admin
      # Senha do banco de dados usado no service POSTGRES
      PASSWORD_DB: postgres123
      ## E-MAIL QUE FARÁ ENVIo DAS MENSAGENS
      SHIPPING_EMAIL: seu-email-real@gmail.com
      ## SENHA DE APLICATIVO DO GMAIL
      PASSWORD_EMAIL: sua_senha_de_app_gerada_aqui
      ## CHAVE PARA GERAR OS TOKENS DE AUTENTICAÇÃO DA API
      PASSWORD_TOKEN: techFix@Api482
      ## NOME DA INSTÂNCIA DO WHATSAPP NA EVOLUTION API
      INSTANCE_NOTIFICATION_OS: techfix-instance
      ## CHAVE DE SEGURANÇA PARA ACESSAR A EVOLUTION API
      EVOLUTION_API_KEY: evolution_api_techFix_12345
      EVOLUTION_API_SERVER: http://evolution:8081
    networks:
      - app_network


  # Redis
  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis123}"]  # Senha do Redis (altere se necessário)
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Evolution API
  evolution:
    image: evoapicloud/evolution-api:v2.3.6
    container_name: evolution_api
    restart: unless-stopped
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=${EVOLUTION_PORT:-8081}
      - SERVER_URL=${EVOLUTION_SERVER_URL:-}
      - LOG_LEVEL=${EVOLUTION_LOG_LEVEL:-ERROR,WARN,DEBUG,INFO}
      - LOG_COLOR=true
      - LOG_BAILEYS=error
      - CORS_ORIGIN=*
      - CORS_METHODS=GET,POST,PUT,DELETE
      - CORS_CREDENTIALS=true
      # Database (use as mesmas credenciais do postgres acima)
      - DATABASE_PROVIDER=postgresql
      ## Coloque os mesmos dados do service Postgres
      - DATABASE_CONNECTION_URI=postgresql://admin:postgres123@postgres:5432/evolution_db?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_LABELS=true
      - DATABASE_SAVE_DATA_HISTORIC=true
      # Redis (use a mesma senha do redis acima)
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      - CACHE_REDIS_PREFIX_KEY=${EVOLUTION_CACHE_REDIS_PREFIX_KEY:-evolution}
      - CACHE_REDIS_SAVE_INSTANCES=false
      - RABBITMQ_ENABLED=false
      - WEBSOCKET_ENABLED=false
      - WEBHOOK_GLOBAL_ENABLED=false
      - WEBHOOK_GLOBAL_URL=
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_MESSAGES_UPDATE=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - QRCODE_LIMIT=30
      - QRCODE_COLOR=#175197
      - CONFIG_SESSION_PHONE_CLIENT=Evolution API
      - CONFIG_SESSION_PHONE_NAME=Chrome
      # Essa e chave da API do Evolution, caso altere aqui, altere tambem a variavel correspondente em Service techFix-api-java
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-evolution_api_techFix_12345}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - TYPEBOT_ENABLED=false
      - CHATWOOT_ENABLED=false
      - OPENAI_ENABLED=false
      - DIFY_ENABLED=false
      - S3_ENABLED=false
      - TZ=America/Sao_Paulo
      - DEL_INSTANCE=false
    ports:
      - "8081:8081"
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - app_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  n8n_data:
    driver: local
  evolution_instances:
    driver: local
  evolution_store:
    driver: local

networks:
  app_network:
    driver: bridge

