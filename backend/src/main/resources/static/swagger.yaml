components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Insira o token JWT no formato "Bearer {token}"
         
  schemas:
    PageMetadata:
      type: object
      description: Componente unificado contendo os metadados da paginação do Spring Boot.
      properties:
        totalPages:
          type: integer
          description: Quantidade total de páginas resultantes.
          example: 3
        number:
          type: integer
          description: Número da página atual(começa por 0)
          example: 0
        size:
          type: integer
          description: Limite máximo de elementos exibidos por página.
          example: 10
        totalElements:
          type: integer
          format: int64
          description: Quantidade total de registros em toda a base de dados.
          example: 25

    ProblemDetail:
      type: object
      description: Padrão oficial RFC 7807 para mapeamento e retorno de erros de API adotado pelo Spring Boot.
      required:
        - title
        - status
        - detail
        - instance
      properties:
        title:
          type: string
          description: Um resumo curto sobre o tipo do problema.
          example: "Bad Request"
        status:
          type: integer
          description: O código de status HTTP retornado na requisição.
          example: 400
        detail:
          type: string
          description: Uma explicação específica sobre a ocorrência do problema.
          example: "O corpo da requisição é inválido ou atributos não atendem aos critérios."
        instance:
          type: string
          description: URI de referência que identifica a chamada e o endpoint que gerou o erro.
