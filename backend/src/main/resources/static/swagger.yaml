          description: Busca realizada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOrderDetailDTO'
        '403':
            description: Acesso negado. Apenas usuários com permissão.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ProblemDetail'
        '404':
            description: Ordem de Serviço não encontrada com ID informado.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ProblemDetail'
    
    put: 
      tags:
        - Service Orders
      summary: Atualiza Ordem de Serviço
      description: |
       Endpoint atualiza Ordem de Serviço permitindo atualizar status e atribuir técnico a OS.
       
       ### Regras de Atribuição de Técnico:
       
       * Para que uma Ordem de Serviço saia de 'PEDING' é obrigatório atribuir um Técnico (Usuário com role TECHNICIAN) Responsável a ela.
       * Uma vez atribuido não será possível trocar Técnico responsável, somente um Usuário com permições do role 'MANAGER'.
      
       ### Regras para atualização de status por Perfil:
        * **Técnico (TECHNICAL)**: Tem autonomia para atulizar todos status exceto ENTREGUE (DELIVERED) e CANCELADO (CANCELED).
        * **Atendente (ATTENDANT):** Tem permissão para atualizar para ENTREGUE ('DELIVERED') se o status já estiver como COMPLETADO (COMPLETED) e também para CANCELADO (CANCELED) caso o status ainda esteja como PEDENTE (PEDING).
        * **GERENTE (MANAGER):** Possui privilégios totais sobre a alterações de status. Mas não pode atualizar se essa Ordem de Serviço j constar comó ENTREGUE (DELIVERED) e com pagamento finalizado.

        * **Completado (COMPLETED):** Ao completar uma Ordem de Serviço automaticamente é gerado um Pagamento já somando todos os gastos e mão de obra realizada.

        ### Validação antes de alterações:
        * **Tarefas e Pagamentos:** O sistema impede a conclusão da OS se houver tarefas pendentes e bloqueia a entrega ao cliente caso as validações de pagamento não sejam atendidas.
        * **Histórico Automático:** Qualquer alteração de status gera um registro de auditoria imutável no histórico da Ordem de Serviço.
        * **Rotina Financeira:** O endpoint aciona automaticamente o processamento e atualização de fluxos de pagamento atrelados à OS.
       
       Este endpoint é acessível somente a usuários do tipo MANAGER, TECHNICAL e ATTENDANT.
      requestBody: 
        content: 
          application/json: 
            schema:
              $ref: '#/components/schemas/ServiceOrderUpdateDTO'
      responses: 
        '200':
          description: Ordem de Serviço atualizada com sucesso.
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/ServiceOrderFullDTO'
        '404':
            description: Ordem de Serviço não encontrada com ID informado.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ProblemDetail'
        '400':
            description: Corpo da requisição mal formatado, ausente ou contendo campos com valores inválidos.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ProblemDetail' 
        '422':
            description: Os dados estão corretos, mas por Regras de Negócios da API a ação não foi permitida.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ProblemDetail'   
        '403':
            description: Acesso negado. Apenas usuários com permissão.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ProblemDetail'

