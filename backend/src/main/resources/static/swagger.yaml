     get:
      tags: 
        - Analytics
      summary: Busca dashboard da assistência técnica
      description: Retorna os dados e indicadores para o dashboard da assistência técnica, permitindo a filtragem por um período específico. Por padrão, se nenhum intervalo for informado, a busca considera desde o primeiro dia do mês vigente até a data atual. Caso seja fornecida apenas a data de início, o filtro se estenderá dessa data até o dia atual. Se apenas a data final for especificada, o sistema retornará os dados compreendidos entre a data informada e os 60 dias que a antecedem. Somente usuário do tipo 'MANAGER' pode realizar essa requisição.
      parameters: 
        - name: start 
          in: query
          schema:
            type: string 
            format: date
          description: Data de início (2026-10-20)
        - name: end 
          in: query
          schema:
            type: string 
            format: date
          description: Data final (2026-10-01)
      responses:
        '200':
          description: Busca realizada com sucesso.
          content:
            application/json: 
              schema:
                $ref: '#/components/schemas/DashboardMetricsDTO'
        '403':
            description: Usuário sem permissão.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: A data de início não pode ser posterior à data de fim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  
  /api/v2/real-time-alerts:
    get:
      tags: 
        - Analytics
      summary: Retorna alertas de estoque e demanda por Tecnico
      description: | 
        Retorna alertas de estoque e demanda por técnico. Existe dois tipo de alerta de Estoque, RED (Vermelho) indica que o estoque está entre ZERO e UM ou abaixo do consumido mês anteriomente, YELLOW (Amarelo) indica que o estoque disponível está acima do consumido mês anteriomente, mas não tem o suficiente para mês seguinte ou pode não ser suficiente caso o cusumo do mês atual aumente. O alerta de estoque e baseado no mês anterior, se uma peça foi usada 6 unidades anteriomente o calculo será baseado nesse valor.
        
        * **Calculo alerta RED (Vermelho)**: o calculo e feito da seguinte forma: **(soma mês anterior) > (quantidade usados mês atual + despónivel no estoque)**, a quantidade de usados do mês atual somado com estoque disponivel é necéssario para saber qual foi o estoque real atual, dessa forma da para saber se o estoque está em risco extremo de falta.

        * **Calculo alerta YELLOW (Amarelo):** o calculo e feito da seguinte forma: **(soma mês anterior) < (quantidade usados mês atual + despónivel no estoque) < (dobro dasoma mês anterior)**, ou seja, o consumo atual está maior que o mês anterior, mas ainda abaixo do dobro dele.
        
        Este endpoint é acessível somente a usuários do tipo MANAGER.
      responses:
        '200': 
          description: Busca realizada com sucesso
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/DashboardAlertsDTO'
        '403':
            description: Usuário sem permissão.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ProblemDetail'

